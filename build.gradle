plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'
description = 'transfer-orchestrator'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

wrapper {
    gradleVersion = '9.2.1'
}

configurations {
    configureEach {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'

    // Use Log4j2 instead of default Logback
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    // Flyway for database migrations
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'

    // JPA API for annotation processing
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'


    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Others
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.3'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.17.7'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-javaagent:' + String.valueOf(configurations.testRuntimeClasspath.find {
        it.name.contains("byte-buddy-agent")
    })
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// --------------------------
// Docker build task
// --------------------------
tasks.register('dockerBuildImage', Exec) {
    group = 'docker'
    description = 'Build Docker image for the application'

    def imageName = project.findProperty('dockerImageName') ?: 'transfer-orchestrator'
    def imageTag = project.findProperty('dockerImageTag') ?: project.version

    commandLine 'docker', 'build',
        '-t', "${imageName}:${imageTag}",
        '.'

    doFirst {
        println "Building Docker image: ${imageName}:${imageTag}"
    }

    doLast {
        println "Docker image built successfully: ${imageName}:${imageTag}"
    }
}

java {
    withSourcesJar()
}

sourceSets {
    main.java.srcDirs += 'build/generated/sources/annotationProcessor/java/main'
}

tasks.named("sourcesJar") {
    dependsOn("compileJava")
}
