server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: "${SWAGGER_UI_ENABLED:true}"
    path: /api-docs
  api-docs:
    path: /v3/api-docs
    enabled: "${API_DOCS_ENABLED:true}"
  server:
    url: "${OPENAPI_SERVER_URL:http://localhost:8080}"
    description: "${OPENAPI_SERVER_NAME:Local Dev}"

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: "${ORCHESTRATOR_DB_URL:jdbc:postgresql://postgres:5432/orchestrator}"
    username: "${ORCHESTRATOR_DB_USER:orchestrator}"
    password: "${ORCHESTRATOR_DB_PASSWORD:orchestrator}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: "${DB_HIKARI_MAX_POOL_SIZE:10}"
      minimum-idle: "${DB_HIKARI_MIN_IDLE:5}"
      connection-timeout: "${DB_HIKARI_CONNECTION_TIMEOUT:10000}"
      idle-timeout: "${DB_HIKARI_IDLE_TIMEOUT:300000}"
      max-lifetime: "${DB_HIKARI_MAX_LIFETIME:540000}"
      leak-detection-threshold: "${DB_HIKARI_LEAK_DETECTION_THRESHOLD:60000}"
      validation-timeout: "${DB_HIKARI_VALIDATION_TIMEOUT:2000}"

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    default-schema: orchestrator
    create-schemas: true
    validate-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: "${JPA_SHOW_SQL:true}"
    properties:
      hibernate:
        globally_quoted_identifiers: true
        default_schema: orchestrator
        format_sql: "${JPA_FORMAT_SQL:true}"
        jdbc:
          fetch_size: "${HIBERNATE_JDBC_FETCH_SIZE:500}"                                # Stream results in chunks
          batch_size: "${HIBERNATE_JDBC_BATCH_SIZE:30}"                                 # Batch DML operations
          default_batch_fetch_size: "${HIBERNATE_JDBC_DEFAULT_BATCH_FETCH_SIZE:30}"     # Lazy fetch in groups
          order_inserts: true
          order_updates: true

  cache:
    type: redis
  data:
    redis:
      host: "${REDIS_HOST:redis}"
      port: "${REDIS_PORT:6379}"
      cluster-mode-enabled: "${REDIS_CLUSTER_MODE_ENABLED:false}"

  kafka:
    admin:
      fail-fast: true
      auto-create: true
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}"
    producer:
      acks: all
      retries: 5
      linger-ms: 10
      batch-size: 1048576
      max-request-size: 5242880
      enable-idempotence: true
    consumer:
      group-id: "${ORCHESTRATOR_GROUP_ID:orchestrator-group-id}"
      auto-offset-reset: earliest
      heartbeat-interval: 10000
      properties:
        spring.json.trusted.packages: com.company.orchestrator
        enable.auto.commit: false
        max.poll.records: 10
        allow.auto.create.topics: false
        fetch.max.bytes: 100000000
        max.partition.fetch.bytes: 100000000
        max.poll.interval.ms: 600000
        session.timeout.ms: 30000
        enable.partition.eof: true
        statistics.interval.ms: 60000
        reconnect.backoff.max.ms: 5000
        partition.assignment.strategy: org.apache.kafka.clients.consumer.RoundRobinAssignor
      retry:
        max-attempts: "${MAX_RETRY_ATTEMPTS:5}"
        backoff-delay: "${BACKOFF_DELAY:5000}"
        backoff-multiplier: "${BACKOFF_MULTIPLIER:2.0}"
        max-interval: "${MAX_RETRY_INTERVAL_MS:30000}"
    listener:
      concurrency: "${KAFKA_LISTENER_CONCURRENCY:5}"
      ack-mode: manual
    properties:
      security.protocol: PLAINTEXT
    topics:
      transfer-requested:
        name: transfer.requested
      policy-approved:
        name: policy.approved
      policy-rejected:
        name: policy.rejected
      negotiation-started:
        name: negotiation.started
      contact-negotiated:
        name: negotiation.completed
      transfer-in-progress:
        name: transfer.in-progress
      transfer-completed:
        name: transfer.completed
      transfer-failed:
        name: transfer.failed
      transfer-terminated:
        name: transfer.terminated
      dlq:
        name: orchestrator-dlq
    topic-config:
      partitions: "${TOPIC_PARTITION:10}"
      replication-factor: "${REPLICATION_FACTOR:1}"

http:
  client:
    connect-timeout: "${HTTP_CLIENT_CONNECT_TIMEOUT_IN_MS:10000}"
    read-timeout: "${HTTP_CLIENT_READ_TIMEOUT_IN_MS:60000}"
    max-total-connection: "${HTTP_CLIENT_MAX_TOTAL_CONNECTION:50}"
    max-connection-per-route: "${HTTP_CLIENT_CONNECTION_PER_ROUTE:10}"

# Mock EDC Configuration (ACTIVE BY DEFAULT - no real EDC needed!)
edc:
  mock:
    callback-base-url: "${MOCK_EDC_CALLBACK_URL:http://localhost:8080}"

    # Contract negotiation delays (milliseconds)
    negotiation-requested-to-offered-delay-ms: "${MOCK_NEGOTIATION_REQUESTED_TO_OFFERED_DELAY_MS:2000}"
    negotiation-offered-to-agreed-delay-ms: "${MOCK_NEGOTIATION_OFFERED_TO_AGREED_DELAY_MS:3000}"
    negotiation-agreed-to-finalized-delay-ms: "${MOCK_NEGOTIATION_AGREED_TO_FINALIZED_DELAY_MS:2000}"

    # Transfer process delays (milliseconds)
    transfer-initial-to-provisioning-delay-ms: "${MOCK_TRANSFER_INITIAL_TO_PROVISIONING_DELAY_MS:1000}"
    transfer-provisioning-to-started-delay-ms: "${MOCK_TRANSFER_PROVISIONING_TO_STARTED_DELAY_MS:2000}"
    transfer-started-to-completed-delay-ms: "${MOCK_TRANSFER_STARTED_TO_COMPLETED_DELAY_MS:3000}"

    # Failure simulation (0.0 = no failures, 0.1 = 10% failure rate, 1.0 = always fail)
    failure-rate: "${MOCK_EDC_FAILURE_RATE:0.0}"

    # Thread pool size for scheduled callbacks
    scheduler-thread-pool-size: "${MOCK_EDC_SCHEDULER_POOL_SIZE:5}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    # Kafka client libraries
    org.apache.kafka.clients.producer: WARN
    org.apache.kafka.clients.producer.internals: ERROR
    org.apache.kafka.clients.consumer: WARN
    org.apache.kafka.common: ERROR

    # Spring Kafka
    org.springframework.kafka: INFO
    org.springframework.kafka.listener: INFO

