server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orchestrator
    username: orchestrator
    password: orchestrator
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

