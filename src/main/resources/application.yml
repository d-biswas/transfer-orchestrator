server:
  port: 8080

spring:
  datasource:
    url: "${ORCHESTRATOR_DB_URL:jdbc:postgresql://postgres-primary:5432/orchestrator}"
    username: ${ORCHESTRATOR_DB_USER:orchestrator}
    password: ${ORCHESTRATOR_DB_PASSWORD:orchestrator}
    driver-class-name: org.postgresql.Driver
    hibernate:
      globally_quoted_identifiers: true
    hikari:
      maximum-pool-size: ${DB_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_HIKARI_MIN_IDLE:5}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME:540000}
      leak-detection-threshold: ${DB_HIKARI_LEAK_DETECTION_THRESHOLD:60000}
      validation-timeout: ${DB_HIKARI_VALIDATION_TIMEOUT:2000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: "${JPA_SHOW_SQL:true}"
    properties:
      hibernate:
        format_sql: "${JPA_FORMAT_SQL:true}"
        jdbc:
          fetch_size: ${HIBERNATE_JDBC_FETCH_SIZE:500}                                # Stream results in chunks
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:30}                                 # Batch DML operations
          default_batch_fetch_size: ${HIBERNATE_JDBC_DEFAULT_BATCH_FETCH_SIZE:30}     # Lazy fetch in groups
          order_inserts: true
          order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

